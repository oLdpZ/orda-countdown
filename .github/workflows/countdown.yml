name: countdown

on:
  schedule:
    - cron: "37 */3 * * *"  # backup only: cron-job.org triggers workflow_dispatch every hour at :01
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency: countdown

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Decrypt launch sound
        continue-on-error: true  # without it the synthesised horn is used
        run: openssl enc -d -aes-256-cbc -pbkdf2 -in assets/suono.ogg.enc -out suono.ogg -pass env:SOUND_KEY
        env:
          SOUND_KEY: ${{ secrets.SOUND_KEY }}
      - run: python countdown.py update
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
      - name: Save state
        run: |
          git config user.name "countdown-bot"
          git config user.email "countdown-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "Update countdown state" && git push)
      - name: Stop after launch
        if: hashFiles('state.json') != ''
        run: |
          if grep -q '"launched": true' state.json; then gh workflow disable countdown.yml; fi
        env:
          GH_TOKEN: ${{ github.token }}
