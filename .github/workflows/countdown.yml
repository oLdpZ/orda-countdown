name: countdown

on:
  schedule:
    - cron: "7 * * * *"  # every hour; GitHub may start it a few minutes late
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency: countdown

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python countdown.py update
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
      - name: Save state
        run: |
          git config user.name "countdown-bot"
          git config user.email "countdown-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "Update countdown state" && git push)
      - name: Stop after launch
        if: hashFiles('state.json') != ''
        run: |
          if grep -q '"launched": true' state.json; then gh workflow disable countdown.yml; fi
        env:
          GH_TOKEN: ${{ github.token }}
